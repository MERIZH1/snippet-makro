<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Install Snippy, an offline menu for snippets, memos, and contacts.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Download Snippy</title>
<meta name="theme-color" content="#0e1015">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./snippet-logo-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./snippet-logo-192.png">
<style>
 :root{--bg:#0e1015;--panel:#1b1f27;--line:#313846;--text:#eef1f6;--sub:#98a2b3;--accent:#5aa2ff;--accent2:#7c5cff}
 *{box-sizing:border-box}
 html,body{margin:0;min-height:100%}
 body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(850px 520px at 20% -10%,rgba(90,162,255,.12),transparent 60%),var(--bg);color:var(--text);font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 main{width:min(100%,430px);text-align:center;background:linear-gradient(180deg,var(--panel),#161a21);border:1px solid var(--line);border-radius:22px;padding:34px 28px 30px;box-shadow:0 24px 60px rgba(0,0,0,.48)}
 img{width:92px;height:92px;border-radius:22px;box-shadow:0 12px 30px rgba(38,56,47,.34)}
 h1{margin:18px 0 24px;font-size:25px;letter-spacing:.2px}
 button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;padding:14px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08101e;font:700 15px inherit;cursor:pointer;box-shadow:0 9px 24px rgba(90,162,255,.3)}
 button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
 button:disabled{cursor:default;opacity:.58;box-shadow:none}
 button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<script>
 if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true){
   window.location.replace('./app.html');
 }
</script>
</head><body>
 <main>
  <img src="./snippet-logo-192.png" alt="">
  <h1>Snippy</h1>
  <button id="installButton" type="button" disabled>
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
   <span>Download app</span>
  </button>
 </main>
<script>
 let installPrompt=null;
 const installButton=document.getElementById('installButton');
 const installLabel=installButton.querySelector('span');

 window.addEventListener('beforeinstallprompt',event=>{
   event.preventDefault();
   installPrompt=event;
   installButton.disabled=false;
   installLabel.textContent='Download app';
 });

 installButton.addEventListener('click',async ()=>{
   if(!installPrompt) return;
   installPrompt.prompt();
   await installPrompt.userChoice;
   installPrompt=null;
   installButton.disabled=true;
 });

 window.addEventListener('appinstalled',()=>{
   installButton.disabled=true;
   installLabel.textContent='App installed';
 });

 if('serviceWorker' in navigator){
   window.addEventListener('load',async ()=>{
     try{ await navigator.serviceWorker.register('./sw.js'); }catch(_){}
   });
 }
</script>
</body></html>
